<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="/"/>
    <meta charset="utf-8"/>
    <style>
      @import url(https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap);
      html {
        --bg: #070a16;
        --surface: #0c1122;
        --card: #101730;
        --border: rgba(148, 163, 255, 0.14);
        --text: #e9ecf9;
        --text-2: #a7b0d2;
        --text-muted: #7983a8;
        --accent: #8b5cf6;
        --accent-2: #22d3ee;
        color-scheme: dark;
        scroll-behavior: smooth;
        scroll-padding-top: 6rem;
      }
      html.light {
        --bg: #f4f6fd;
        --surface: #ffffff;
        --card: #ffffff;
        --border: rgba(80, 90, 150, 0.18);
        --text: #171c30;
        --text-2: #4a5375;
        --text-muted: #7a84a8;
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html, body {
        width: 100%;
        min-height: 100vh;
        padding: 0;
        margin: 0;
        color: var(--text);
        font-family: 'Inter', sans-serif;
        font-size: 16px;
        line-height: 1.6rem;
        background-color: var(--bg);
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
      }
      h1, h2, h3, h4, h5, h6 {
        margin: 0;
        color: var(--text);
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.15rem;
      }
      a {
        cursor: pointer;
        color: inherit;
        text-decoration: none;
      }
      img {
        display: block;
        max-width: 100%;
      }
      button {
        padding: 0;
        border: none;
        cursor: pointer;
        color: inherit;
        font-family: inherit;
        background-color: transparent;
      }
      ::selection {
        color: #ffffff;
        background-color: #8b5cf6;
      }
      *:focus {
        outline: none;
      }
      *:focus-visible {
        outline: 2px solid #a78bfa;
        outline-offset: 2px;
      }
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-thumb {
        border-radius: 10px;
        background-color: rgb(88, 98, 146);
        border: 2px solid var(--bg);
      }
      ::-webkit-scrollbar-track {
        background-color: transparent;
      }
      .container {
        width: 100%;
        max-width: 72rem;
        padding-left: 1.5rem;
        padding-right: 1.5rem;
        margin-left: auto;
        margin-right: auto;
      }
      .section {
        position: relative;
        padding-top: 5.5rem;
        padding-bottom: 5.5rem;
      }
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: 0;
        overflow: hidden;
        white-space: nowrap;
        clip: rect(0 0 0 0);
        border: 0;
      }
      .page-bg {
        position: fixed;
        top: 0px;
        left: 0px;
        bottom: 0px;
        right: 0px;
        z-index: -1;
        background-color: var(--bg);
        background-image: radial-gradient(620px circle at 18% -5%, rgba(139,92,246,0.16), transparent 62%), radial-gradient(720px circle at 92% 105%, rgba(34,211,238,0.10), transparent 62%);
        background-repeat: no-repeat;
        background-size: 100% 100%;
      }
      .page-grid {
        position: fixed;
        top: 0px;
        left: 0px;
        bottom: 0px;
        right: 0px;
        z-index: -1;
        opacity: 0.9;
        pointer-events: none;
        background-image: linear-gradient(rgba(139,92,246,0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(139,92,246,0.06) 1px, transparent 1px);
        background-size: 34px 34px;
        mask-image: linear-gradient(to bottom, black 0%, black 55%, transparent 100%);
        -webkit-mask-image: linear-gradient(to bottom, black 0%, black 55%, transparent 100%);
      }
      .gradient-text {
        color: transparent;
        background-clip: text;
        -webkit-background-clip: text;
        background-image: linear-gradient(135deg, #a78bfa 0%, #22d3ee 100%);
      }
      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        color: #a78bfa;
        font-size: 0.8rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.12em;
      }
      .eyebrow::before {
        content: """";
        width: 1.5rem;
        height: 1px;
        opacity: 0.6;
        background-color: #8b5cf6;
      }
      .reveal {
        opacity: 0.0;
        transition: opacity 600ms ease-out, transform 700ms ease-out;
        transform: translateY(24px);
        will-change: opacity, transform;
      }
      .reveal.is-visible {
        opacity: 1.0;
        transform: translateY(0px);
      }
      @keyframes fadeUp {
        from {
          opacity: 0.0;
          transform: translateY(28px);
        }
        to {
          opacity: 1.0;
          transform: translateY(0px);
        }
      }
      @keyframes floatY {
        0% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-14px);
        }
        100% {
          transform: translateY(0px);
        }
      }
      @media screen and (min-width: 720px) {
        .container {
          padding-left: 2.5rem;
          padding-right: 2.5rem;
        }
        .section {
          padding-top: 7rem;
          padding-bottom: 7rem;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          scroll-behavior: auto;
          transition-duration: 0ms;
          animation-duration: 0ms;
        }
        .reveal {
          opacity: 1.0;
          transform: translateY(0px);
        }
      }
      .scaffold-note {
        display: flex;
        min-height: 80vh;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 0.75rem;
        color: var(--text-2);
      }
      .scaffold-note .scaffold-note-dot {
        width: 12px;
        height: 12px;
        border-radius: 12px;
        box-shadow: 0px 0px 18px rgb(from #a78bfa r g b / 0.8);
        background-color: #a78bfa;
      }
    </style>

    <title>Shadow Dev — Flutter Developer &amp; Software Engineer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="description" content="Shadow Dev — Flutter Developer building mobile and web apps with clean, responsive, open-source-minded code."/>
    <meta name="theme-color" content="#070a16"/>
    <meta name="og:type" content="website"/>
    <meta name="og:site_name" content="Shadow Dev"/>
